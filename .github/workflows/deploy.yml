name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test with coverage
        run: yarn test --silent --coverage --coverageReporters=json-summary --coverageReporters=text-summary

      - name: Build
        run: yarn build
        env:
          CI: true
          PUBLIC_URL: /${{ github.event.repository.name }}

      # GitHub Pages has no SPA fallback: serve index.html for unknown routes
      # so deep links like /invoices/12 work on reload.
      - name: SPA fallback
        run: cp build/index.html build/404.html

      # Published with the site and read by the shields.io badge in the README.
      - name: Coverage badge data
        run: node bin/coverage-badge.js coverage/coverage-summary.json build/coverage-badge.json

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: build

  # Builds the app served from the root and checks what visitors get:
  # Lighthouse scores and the size of the JavaScript sent to the browser.
  quality:
    name: Lighthouse and bundle size
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build
        env:
          CI: true

      - name: Bundle-size budget
        run: node bin/bundle-budget.mjs build 600

      - name: Lighthouse
        run: npx -y @lhci/cli@0.15.1 autorun

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: lighthouse-report

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
